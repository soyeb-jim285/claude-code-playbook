<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    :root { color-scheme: light dark; --line: #8884; --accent: #b4532a; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
    form, .search { display: flex; gap: .5rem; margin-bottom: .75rem; }
    input { flex: 1; padding: .55rem .7rem; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    button { padding: .55rem .9rem; font: inherit; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 1.5rem; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
    li button { background: transparent; color: var(--accent); padding: .2rem .4rem; }
    #error { color: var(--accent); min-height: 1.5em; margin: 0; }
  </style>
</head>
<body>
  <h1>Notes</h1>

  <form id="add-form">
    <input id="note-input" aria-label="New note" placeholder="Write a note" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <div class="search">
    <input id="search-input" type="search" aria-label="Search notes" placeholder="Search">
  </div>

  <p id="error" role="alert"></p>
  <ul id="notes"></ul>

  <script type="module">
    const list = document.querySelector('#notes');
    const input = document.querySelector('#note-input');
    const search = document.querySelector('#search-input');
    const error = document.querySelector('#error');

    async function refresh() {
      const res = await fetch(`/api/notes?q=${encodeURIComponent(search.value)}`);
      const notes = await res.json();
      list.replaceChildren(...notes.map(renderNote));
    }

    function renderNote(note) {
      const item = document.createElement('li');
      item.innerHTML = `<span>${note.text}</span>`;

      const remove = document.createElement('button');
      remove.textContent = 'Delete';
      remove.setAttribute('aria-label', `Delete note ${note.id}`);
      remove.addEventListener('click', async () => {
        await fetch(`/api/notes/${note.id}`, { method: 'DELETE' });
        refresh();
      });

      item.append(remove);
      return item;
    }

    document.querySelector('#add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const res = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: input.value }),
      });
      if (!res.ok) {
        error.textContent = (await res.json()).error;
        return;
      }
      error.textContent = '';
      input.value = '';
      refresh();
    });

    search.addEventListener('input', refresh);
    refresh();
  </script>
</body>
</html>
